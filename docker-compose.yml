services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: library_db
      POSTGRES_USER: library_user
      POSTGRES_PASSWORD: library_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8002 --workers 2
    volumes:
      - .:/app
    ports:
      - "8002:8002"
    env_file:
      - .env.docker
    depends_on:
      - db

volumes:
  postgres_data: